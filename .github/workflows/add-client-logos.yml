name: Add client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add client logos workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add logos safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<li class="client-logo mondo">MONDO<small>ROMANIA</small></li>': '<li class="client-logo mondo"><img src="assets/clients/mondo.svg" alt="MONDO Romania logo" loading="lazy"></li>',
              '<li class="client-logo vinca">VINCA</li>': '<li class="client-logo vinca"><img src="assets/clients/vinca.svg" alt="VINCA logo" loading="lazy"></li>',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          grep -Fq 'assets/clients/mondo.svg' index.html
          grep -Fq 'assets/clients/vinca.svg' index.html
          grep -Fq 'assets/clients/vulconplast.svg' index.html
          git diff --check
      - name: Clean workflow
        run: rm -f .github/workflows/add-client-logos.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-client-logos.yml
          git commit -m 'Add client logos workflow'
          git push
