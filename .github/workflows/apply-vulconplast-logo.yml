name: Apply Vulconplast logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add logo to client list
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<li class="client-logo">VULCONPLAST<small>SRL</small></li>'
          new = '<li class="client-logo vulconplast"><img src="assets/clients/vulconplast.svg" alt="VULCONPLAST SRL logo" loading="lazy"></li>'
          if old in s:
              s = s.replace(old, new, 1)
          css = '.client-logo img{max-width:100%;max-height:58px;width:auto;height:auto;object-fit:contain}'
          if css not in s:
              anchor = '.client-logo.elixir{font-size:16px}'
              if anchor not in s:
                  raise SystemExit('Client logo CSS anchor not found')
              s = s.replace(anchor, anchor + css, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          grep -Fq 'assets/clients/vulconplast.svg' index.html
          git diff --check
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-vulconplast-logo.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          rm -f .github/workflows/apply-vulconplast-logo.yml
          git add -u .github/workflows/apply-vulconplast-logo.yml
          git commit -m 'Add Vulconplast logo to client list'
          git push
