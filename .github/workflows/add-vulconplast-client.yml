name: Add Vulconplast client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add one-time Vulconplast client workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add client safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          entry = Path('client-vulconplast.tmp').read_text(encoding='utf-8').strip()
          marker = '<ul class="client-strip">'
          if '>VULCONPLAST<small>SRL</small>' not in s:
              start = s.find(marker)
              if start == -1:
                  raise SystemExit('Client list not found; refusing to modify index.html')
              end = s.find('</ul>', start)
              if end == -1:
                  raise SystemExit('Client list closing tag not found; refusing to modify index.html')
              s = s[:end] + '  ' + entry + '\n' + s[end:]
              p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          grep -Fq '>VULCONPLAST<small>SRL</small>' index.html
          git diff --check
      - name: Clean helpers
        run: |
          rm -f client-vulconplast.tmp .github/workflows/add-vulconplast-client.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html client-vulconplast.tmp .github/workflows/add-vulconplast-client.yml
          git commit -m 'Add Vulconplast to trusted clients'
          git push
