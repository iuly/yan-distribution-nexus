name: Add Vulconplast testimonial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add one-time Vulconplast testimonial workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert testimonial safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<article class="card"><p class="quote">„O colaborare excelentă. Profesionalism și suport tehnic oricând este nevoie.”</p><p class="who"><strong>Cabinet Contabilitate Cecilia Agavriloaie</strong></p></article>\n'
          testimonial = Path('testimonials/vulconplast.html').read_text(encoding='utf-8')
          if 'VULCONPLAST SRL</strong>Ec. Maria Manole' in s:
              print('Testimonial already present; no insertion needed.')
          else:
              if marker not in s:
                  raise SystemExit('Expected testimonial marker not found; refusing to modify index.html')
              s = s.replace(marker, marker + testimonial, 1)
              p.write_text(s, encoding='utf-8')
      - name: Verify only intended index change
        run: |
          grep -Fq 'VULCONPLAST SRL</strong>Ec. Maria Manole' index.html
          git diff --check
      - name: Remove temporary helper files
        run: |
          rm -f testimonials/vulconplast.html
          rm -f .github/workflows/add-vulconplast-testimonial.yml
          rmdir testimonials 2>/dev/null || true
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html testimonials/vulconplast.html .github/workflows/add-vulconplast-testimonial.yml
          git commit -m 'Publish Vulconplast testimonial'
          git push
