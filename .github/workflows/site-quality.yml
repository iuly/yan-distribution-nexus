name: Site quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: HTML, links and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@10 index.html

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir . --accept 200,204,206,429 './**/*.html'
          fail: true

      - name: Start local site
        run: python3 -m http.server 4173 > /tmp/yan-site-server.log 2>&1 &

      - name: Check accessibility
        run: npx --yes pa11y@9 http://127.0.0.1:4173 --standard WCAG2AA --chrome-launch-config .pa11y-chrome.json
